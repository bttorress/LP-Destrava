name: Deploy to GitHub Pages

# Publica a landing page estática (raiz do repositório) no GitHub Pages.
on:
  push:
    branches: ["claude/destrava-landing-page-ibf9g3"]
  workflow_dispatch:

# Permissões necessárias para o deploy no Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Garante um deploy por vez, sem cancelar um deploy em andamento.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          # Habilita o Pages automaticamente (build type = GitHub Actions),
          # caso ainda não esteja ativo nas configurações do repositório.
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Site estático servido a partir da raiz do repositório.
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
